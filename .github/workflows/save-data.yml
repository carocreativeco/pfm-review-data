name: Catch and Save JSON

on:
  repository_dispatch:
    types: [update_json]

jobs:
  update-file:
    runs-on: ubuntu-latest
    # This automatically gives the bot permission to save the file!
    permissions:
      contents: write 
      
    steps:
      - uses: actions/checkout@v3

      - name: Save JSON to file
        env:
          ENCODED_DATA: ${{ github.event.client_payload.my_data }}
        run: echo "$ENCODED_DATA" | base64 --decode > locations.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add locations.json
          git commit -m "Automated JSON update from Power Automate"
          git push
