name: Catch and Save JSON

on:
  repository_dispatch:
    types: [update_json]

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      # Updated to v4 to fix the Node.js warning!
      - uses: actions/checkout@v4

      - name: Save JSON to file
        env:
          ENCODED_DATA: ${{ github.event.client_payload.my_data }}
        run: echo "$ENCODED_DATA" | base64 --decode > locations.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add locations.json
          
          # Smart Check: Only save/push if the JSON data actually changed!
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Automated JSON update from Power Automate"
            git push
          else
            echo "Data is identical to previous run. Nothing new to save."
          fi
